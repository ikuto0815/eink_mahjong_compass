; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
lib_deps = zinggjm/GxEPD2@^1.6.9
           liux-pro/qrcode generator@^1.7.2

[env:esp32s3]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
platform = https://github.com/pioarduino/platform-espressif32.git
; close enough to our hardware
board = waveshare_esp32_s3_zero
board_build.partitions = huge_app.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=1
lib_deps = ${common.lib_deps}

custom_sdkconfig = ; bluetooth model sleep powered by external crystal
                   CONFIG_BT_CTRL_MODEM_SLEEP=y
                   CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
                   CONFIG_BT_CTRL_LPCLK_SEL_EXT_32K_XTAL=y
                   CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y
                   ; use external crystal as clock source
                   CONFIG_RTC_CLK_SRC_EXT_CRYS=y
                   CONFIG_RTC_CLK_CAL_CYCLES=3000
                   CONFIG_FREERTOS_UNICORE=y
                   CONFIG_ESP_PHY_MAC_BB_PD=y
                   ; enable power management and dynamic frequency scaling
                   CONFIG_PM_ENABLE=y
                   CONFIG_PM_DFS_INIT_AUTO=y
                   CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
                   CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
                   ; turn off unneeded features
                   CONFIG_PPP_SUPPORT=n
                   CONFIG_BLE_MESH=n
                   ; turn off spiram
                   CONFIG_SPIRAM=n
                   ; reduce tx power
                   CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=10
                   CONFIG_ESP_PHY_MAX_TX_POWER=10
                   ; turn off wifi
                   CONFIG_ESP_WIFI_ENABLED=n
                   ; reduce clock speed from 240 to 160 MHz
                   CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_160=y
                   CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=160
                   ; use internal USB as default console
                   CONFIG_ESP_CONSOLE_USB_CDC=y
                   ; turn off light sleep when a USB connection is detected to prevent disconnects
                   CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
